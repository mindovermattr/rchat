openapi: 3.0.3
info:
  title: rchat API
  description: rchat backend API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local dev
tags:
  - name: auth
  - name: users
paths:
  /:
    get:
      operationId: getHello
      summary: Health check
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: string
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "401":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login and get an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      operationId: me
      tags: [users]
      summary: Get the current authenticated user
      security:
        - bearer: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterBody:
      type: object
      additionalProperties: false
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        name:
          type: string
          minLength: 2
          maxLength: 255
          example: John Doe
        password:
          type: string
          minLength: 8
          maxLength: 255
          example: password123
    LoginBody:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          example: password123
    SafeUser:
      type: object
      additionalProperties: false
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
        createdAt:
          type: string
    RegisterResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: "#/components/schemas/SafeUser"
        accessToken:
          type: string
    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string